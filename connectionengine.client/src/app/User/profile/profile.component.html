<div class="min-h-screen bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center px-4">

  <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-10">

    <!-- Title -->
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
      Create Your Profile
    </h2>

    <form (ngSubmit)="createProfile()" class="space-y-6">

      <!-- Profile Picture -->
      <div class="flex justify-center mb-6">
        <label class="cursor-pointer">
          <div class="w-28 h-28 rounded-full bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center hover:bg-gray-200 transition">
            <span class="text-sm text-gray-500 text-center">
              Upload Photo
            </span>
          </div>
          <input type="file" class="hidden" (change)="OnFieldChangeProfilePhoto($event)" accept="image/" />
        </label>
      </div>

      <!-- Name -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          Full Name
        </label>
        <input type="text"
               [(ngModel)]="model.name"
               name="name"
               required
               class="w-full px-4 py-3 border border-gray-300 rounded-lg
         bg-gray-50 text-gray-900 placeholder-gray-400
         focus:ring-2 focus:ring-purple-500 focus:border-purple-500
         outline-none transition"
               placeholder="John Doe" />
      </div>

      <!-- Age + Gender -->
      <div class="grid grid-cols-2 gap-6">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">
            Date of Birth
          </label>

          <input type="date"
                 [(ngModel)]="model.dateOfBirth"
                 name="dateOfBirth"
                 required
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg
           bg-gray-50 text-gray-800
           focus:ring-2 focus:ring-purple-500 focus:border-purple-500
           outline-none transition" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">
            Gender
          </label>
          <select [(ngModel)]="model.gender"
                  name="gender"
                  required
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg
         bg-gray-50 text-gray-800
         focus:ring-2 focus:ring-purple-500 focus:border-purple-500
         outline-none transition">
            <option value="">Select Gender</option>
            <option value="0">Male</option>
            <option value="1">Female</option>
            <option value="2">Other</option>
          </select>
        </div>

      </div>

      <!-- Bio -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          Bio
        </label>
        <textarea [(ngModel)]="model.bio"
                  name="bio"
                  rows="3"
                  maxlength="500"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg
         bg-gray-50 text-gray-900
         focus:ring-2 focus:ring-purple-500 outline-none"
                  placeholder="Tell something interesting about yourself..."></textarea>
      </div>

      <!-- City + Country -->
      <div class="grid grid-cols-2 gap-6">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">
            City
          </label>
          <input type="text"
                 [(ngModel)]="model.city"
                 name="city"
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg
         bg-gray-50 text-gray-900 placeholder-gray-400
         focus:ring-2 focus:ring-purple-500 focus:border-purple-500
         outline-none transition"
                 placeholder="Bangalore" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">
            Country
          </label>
          <input type="text"
                 [(ngModel)]="model.country"
                 name="country"
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg
         bg-gray-50 text-gray-900 placeholder-gray-400
         focus:ring-2 focus:ring-purple-500 focus:border-purple-500
         outline-none transition"
                 placeholder="India" />
        </div>

      </div>

      <!-- Button -->
      <div class="pt-6">
        <button type="submit"
                class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-semibold py-3 rounded-lg shadow-md hover:scale-[1.02] hover:shadow-lg transition">
          Create Profile
        </button>
      </div>

    </form>

  </div>

</div>
