<header class="w-full h-14 flex items-center px-6 border-b bg-white">

  <div class="font-semibold text-gray-800 text-lg">
    <span class="text-2xl font-semibold text-gray-800">
      Connection <span class="font-normal text-blue-600">Engine</span>
    </span>
  </div>

  <div class="ml-auto" *ngIf="authService.isLoggedIn()">
    <button class="flex items-center gap-2 px-3 py-1.5 rounded-md
             text-sm text-gray-600 hover:bg-red-50
             hover:text-red-600 transition"
            (click)="logout()">

      <svg xmlns="http://www.w3.org/2000/svg"
           class="h-5 w-5"
           fill="none"
           viewBox="0 0 24 24"
           stroke="currentColor">
        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1" />
      </svg>

      Logout
    </button>
  </div>

</header>
<router-outlet> </router-outlet>
