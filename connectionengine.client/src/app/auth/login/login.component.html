<div class="min-h-screen flex bg-white">

  <div class="hidden lg:flex w-1/2 flex-col justify-between p-12 bg-gray-50 border-r border-gray-200">

 
    <div class="flex items-center gap-3">
     
    </div>

   
    <div class="text-sm text-gray-400">
      Secure login with Google Authenticator 2FA
    </div>

  </div>


  <div class="w-full lg:w-1/2 flex items-center justify-center px-4">

    <div class="w-full max-w-md border border-gray-200 rounded-xl p-8 shadow-sm bg-white">

      <h1 class="text-2xl font-semibold text-center text-gray-800">
        Login
      </h1>

      <p class="text-sm text-center text-gray-500 mt-1">
        Enter your credentials to continue
      </p>

      <div class="mt-6 space-y-5">

       
        <div>
          <label class="text-sm text-gray-600">Email</label>
          <input type="email"
                 placeholder="you@example.com"
                 class="w-full border-b border-gray-300 bg-transparent
                   text-gray-900 placeholder-gray-400
                   focus:outline-none focus:border-blue-500"
                 [(ngModel)]="email" />
        </div>

        <div>
          <label class="text-sm text-gray-600">Password</label>
          <input type="password"
                 placeholder="••••••••"
                 class="w-full border-b border-gray-300 bg-transparent
                   text-gray-900 placeholder-gray-400
                   focus:outline-none focus:border-blue-500"
                 [(ngModel)]="password" />
        </div>

        <div>
          <label class="text-sm text-gray-600">
            One-Time Password (OTP)
          </label>
          <input type="text"
                 placeholder="6-digit code from Google Authenticator"
                 class="w-full border-b border-gray-300 bg-transparent
                   text-gray-900 placeholder-gray-400
                   focus:outline-none focus:border-blue-500 tracking-widest"
                 [(ngModel)]="otp" />
        </div>

      
        <button class="w-full bg-green-600 hover:bg-green-700
                 text-white py-2.5 rounded-md font-medium transition"
                (click)="login()">
          Login
        </button>

        <p class="text-xs text-center text-gray-400 mt-3">
          Protected by Google Authenticator 2FA
        </p>

        <p class="text-sm text-center text-gray-600 mt-4">
          Don’t have an account?
          <a  (click)="Signup()" class="text-blue-600 hover:underline">
            Sign up
          </a>
        </p>

      </div>

    </div>

  </div>

</div>
