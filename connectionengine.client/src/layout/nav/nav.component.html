<header class="sticky top-0 z-50 w-full backdrop-blur bg-base-100/90 border-b border-base-300">

  <div *ngIf="authService.loggedIn()">

    <div class="navbar max-w-7xl mx-auto px-6">

      <!-- LEFT -->
      <div class="navbar-start gap-10">

        <!-- Brand -->
        <span class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent cursor-pointer">
          ConnectionEngine
        </span>

        <!-- Navigation -->
        <ul class="menu menu-horizontal px-1 text-sm hidden md:flex gap-2">

          <li>
            <a routerLink="/explore"
               routerLinkActive="active"
               class="rounded-lg hover:bg-base-200 transition">
              Matches
            </a>
          </li>

          <li>
            <a routerLink="/messages"
               routerLinkActive="active"
               class="rounded-lg hover:bg-base-200 transition">
              Messages
            </a>
          </li>

        </ul>

      </div>


      <!-- RIGHT -->
      <div class="navbar-end gap-3 text-sm">

        <!-- Search -->
        <a class="hidden sm:inline-flex btn btn-ghost btn-sm hover:bg-base-200">
          Search Nearby
        </a>

        <!-- Create Profile -->
        <a routerLink="/profile"
           class="btn btn-primary btn-sm rounded-lg shadow-sm hover:shadow-md transition">
          Create Profile
        </a>

        <!-- USER DROPDOWN -->
        <div class="dropdown dropdown-end">

          <label tabindex="0" class="btn btn-ghost btn-circle avatar">

            <div class="w-9 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 text-white flex items-center justify-center font-semibold shadow">

              {{ userInitial }}

            </div>

          </label>

          <ul tabindex="0"
              class="dropdown-content menu p-2 shadow-lg bg-base-100 rounded-xl w-56 mt-3 border border-base-200">

            <!-- Email -->
            <li class="px-3 py-2 text-xs text-base-content/70 truncate">
              {{ email }}
            </li>

            <li>
              <a routerLink="/profile">
                Profile
              </a>
            </li>

            <li>
              <a routerLink="/search-nearby">
                Search Nearby
              </a>
            </li>

            <div class="divider my-1"></div>

            <li>
              <a class="text-error" (click)="logout()">
                Logout
              </a>
            </li>

          </ul>

        </div>

      </div>

    </div>

  </div>

</header>
