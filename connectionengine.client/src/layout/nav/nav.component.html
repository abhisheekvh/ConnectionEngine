<header class="w-full h-16 flex items-center justify-between px-6 border-b bg-white shadow-sm">

  @if(isLoggedIn)
  {
  <!-- Left -->
  <div class="flex items-center gap-6">
    <span class="text-xl font-bold text-gray-900">
      Connection Engine
    </span>

    <a routerLink="/explore"
       class="text-sm text-gray-600 hover:text-black transition">
      Matches
    </a>

    <a routerLink="/messages"
       class="text-sm text-gray-600 hover:text-black transition">
      Messages
    </a>
  </div>

  <!-- Right -->
  <div class="flex items-center gap-4 text-sm">

    <a class="text-gray-600 hover:text-black cursor-pointer">
      Search Nearby
    </a>

    <a routerLink="/profile"
       class="text-gray-600 hover:text-black cursor-pointer">
      Create Profile
    </a>

    <!-- User Dropdown -->
    <div class="dropdown dropdown-end">

      <label tabindex="0" class="btn btn-ghost btn-circle avatar">
        <div class="w-9 rounded-full bg-indigo-600 text-white
                    flex items-center justify-center font-semibold">
          {{ userInitial }}
        </div>
      </label>

      <ul tabindex="0"
          class="dropdown-content menu p-2 shadow bg-base-100
                 rounded-box w-52 mt-2">

        <li class="px-2 py-1 text-sm text-gray-500">
          {{ email }}
        </li>

        <li>
          <a routerLink="/profile">👤 Profile</a>
        </li>

        <li>
          <a routerLink="/search-nearby">📍 Search Nearby</a>
        </li>

        <li class="border-t mt-1">
          <a class="text-red-600 cursor-pointer"
             (click)="logout()">
            🚪 Logout
          </a>
        </li>

      </ul>
    </div>

  </div>
  }
</header>
