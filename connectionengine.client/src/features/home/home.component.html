<div class="min-h-screen flex items-center justify-center bg-white text-gray-900">
  <div class="text-center">

    @if(!RegisterMode())
    {
    <div class="flex justify-center mb-6">
      <div class="p-5 rounded-xl bg-primary text-primary-content shadow">
        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="1.5"
             stroke="currentColor"
             class="w-16 h-16">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 19.128a9.38 9.38 0 0 0 2.625.372
                9.337 9.337 0 0 0 4.121-.952
                4.125 4.125 0 0 0-7.533-2.493
                M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07
                M15 19.128v.106A12.318 12.318 0 0 1 8.624 21
                c-2.331 0-4.512-.645-6.374-1.766l-.001-.109
                a6.375 6.375 0 0 1 11.964-3.07
                M12 6.375a3.375 3.375 0 1 1-6.75 0
                3.375 3.375 0 0 1 6.75 0
                Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0
                2.625 2.625 0 0 1 5.25 0Z" />
        </svg>
      </div>
    </div>
    



    <h1 class="text-4xl font-bold mb-3">
      Find your match
    </h1>

    <p class="text-gray-500 mb-8">
      Come on in... all you need to do is sign up
    </p>

    <div class="flex gap-4 justify-center">
      <button class="btn btn-primary" (click)="ShowRegister()" routerLink="/register">
        Register
      </button>

      <button class="btn btn-info btn-outline" routerLink="/about">
        Learn more
      </button>
    </div>
    }
    @else
    {
          here
    }

  </div>
</div>
